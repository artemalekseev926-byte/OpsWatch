name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opswatch
          POSTGRES_PASSWORD: opswatch
          POSTGRES_DB: opswatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opswatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPSWATCH_TEST_DATABASE_URL: postgresql+asyncpg://opswatch:opswatch@127.0.0.1:5432/opswatch
      OPSWATCH_TEST_PG_DSN: postgresql://opswatch:opswatch@127.0.0.1:5432/opswatch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests on PostgreSQL
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t opswatch:ci .
      - name: Smoke test container
        run: |
          docker run -d --name opswatch -p 8765:8765 opswatch:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/api/health; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/api/health
          curl -sf -X POST http://127.0.0.1:8765/api/auth/login -H "Content-Type: application/json" -d '{"username":"admin1","password":"admin1"}' > /dev/null
          docker exec opswatch pg_dump --version
          docker exec opswatch mysqldump --version
          docker logs opswatch
