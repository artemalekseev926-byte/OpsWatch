services:
  postgres:
    image: postgres:16-alpine
    container_name: opswatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opswatch
      POSTGRES_USER: opswatch
      POSTGRES_PASSWORD: ${OPSWATCH_DB_PASSWORD:-opswatch}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opswatch -d opswatch"]
      interval: 5s
      timeout: 5s
      retries: 20

  opswatch:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPSWATCH_DATABASE_URL: postgresql+asyncpg://opswatch:${OPSWATCH_DB_PASSWORD:-opswatch}@postgres:5432/opswatch
