[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opswatch"
version = "0.3.0"
description = "Monitoring, backups and Telegram alerts for system and 1C administrators"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "NICE_STUD" }]
keywords = ["monitoring", "1c", "backup", "telegram", "zabbix", "alertmanager", "mysql", "postgresql", "mssql"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Framework :: FastAPI",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "aiogram>=3.13,<4",
    "apscheduler>=3.10,<4",
    "cryptography>=42",
    "pyzipper>=0.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "aiomysql>=0.2",
    "asyncpg>=0.29",
    "pymssql>=2.3",
    "tzlocal>=5",
    "alembic>=1.13",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
desktop = ["pystray>=0.19", "pillow>=10", "pywebview>=5"]
windows = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pillow>=10"]
all = ["opswatch[s3,desktop,windows]"]

[project.urls]
Homepage = "https://github.com/artemalekseev926-byte/OpsWatch"

[project.scripts]
opswatch = "opswatch.cli:main"

[tool.setuptools.packages.find]
include = ["opswatch*"]

[tool.setuptools.package-data]
opswatch = ["web/static/*", "locales/*.json", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: tests that need external services"]
